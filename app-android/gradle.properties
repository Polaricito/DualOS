# Shared build server: keep the Gradle daemon at 2 GB heap and at most 3 workers.
# Kotlin compiles inside the Gradle daemon (no second 2 GB Kotlin daemon next to it).
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.workers.max=3
org.gradle.parallel=true
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official

# JDK 21 toolchain comes from the machine; never download one.
org.gradle.java.installations.auto-download=false

android.useAndroidX=true
